name: Generate Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Aditgm
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&bg_color=0D1117&color_snake=6C5CE7&color_dots=#161B22,#2575FC,#4A8CFF,#6C5CE7,#9B7CFF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
